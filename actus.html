<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actus &amp; mercato — OM Live</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <h1 class="page-title">Actus &amp; mercato</h1>
    <p class="page-subtitle">Flux agrégé depuis les sources suivies (voir js/data.js pour brancher un vrai flux RSS).</p>
    <div id="news-list" style="display:flex;flex-direction:column;gap:12px"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("actus.html");
    getNews().then((news) => {
      document.getElementById("news-list").innerHTML = news.map(newsCardHtml).join("");
    });
  </script>
</body>
</html>
