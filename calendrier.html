<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendrier — OM Live</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <h1 class="page-title">Calendrier</h1>
    <p class="page-subtitle">Les prochains matchs de l'OM, toutes compétitions. <span id="updated-at" class="note" style="margin:0"></span></p>
    <div id="fixtures-list" style="display:flex;flex-direction:column;gap:12px"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("calendrier.html");

    function refreshFixtures() {
      getFixtures().then((fixtures) => {
        document.getElementById("fixtures-list").innerHTML =
          fixtures.length
            ? fixtures.map(fixtureCardHtml).join("")
            : `<p style="opacity:.5">Aucun match programmé pour le moment.</p>`;
        renderUpdatedAt("updated-at");
      });
    }

    startAutoRefresh(refreshFixtures, 120000);
  </script>
</body>
</html>
