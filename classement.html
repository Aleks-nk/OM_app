<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classement — OM Live</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230E2233%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%233FA9F5%22 font-family=%22Arial%22 font-weight=%22bold%22>OM</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <h1 class="page-title">Classement</h1>
    <p class="page-subtitle">Ligue 1, saison en cours. <span id="updated-at" class="note" style="margin:0"></span></p>
    <table>
      <thead>
        <tr><th>#</th><th>Équipe</th><th class="center">J</th><th class="center">Diff.</th><th class="center">Pts</th></tr>
      </thead>
      <tbody id="standings-body"></tbody>
    </table>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("classement.html");

    function refreshStandings() {
      getStandings().then((standings) => {
        document.getElementById("standings-body").innerHTML = standings.map((row) => {
          const isOM = row.team.includes("Marseille");
          const gd = row.gd > 0 ? `+${row.gd}` : row.gd;
          return `
            <tr class="${isOM ? "highlight" : ""}">
              <td>${row.pos}</td>
              <td>${row.team}</td>
              <td class="center">${row.played}</td>
              <td class="center">${gd}</td>
              <td class="center pts">${row.pts}</td>
            </tr>`;
        }).join("");
        renderUpdatedAt("updated-at");
      }).catch((err) => renderFetchError("standings-body", err, 5));
    }

    // Se remet à jour toutes les 2 minutes tant que l'onglet est ouvert.
    startAutoRefresh(refreshStandings, 120000);
  </script>
</body>
</html>
